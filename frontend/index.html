<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VisionAI - Ứng dụng phân tích ảnh thông minh bằng AI">
    <title>VisionAI - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animated"></div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo & Title -->
            <div class="logo">🔮</div>
            <h1>VisionAI</h1>
            <p class="subtitle">Phân tích ảnh thông minh với trí tuệ nhân tạo</p>

            <!-- Auth Tabs: Đăng nhập / Đăng ký -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
                <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Đăng ký</button>
            </div>

            <!-- Thông báo lỗi/thành công -->
            <div class="message" id="auth-message"></div>

            <!-- Form Đăng nhập -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-login">
                    Đăng nhập
                </button>
            </form>

            <!-- Form Đăng ký (ẩn mặc định) -->
            <form id="signup-form" style="display: none;" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Mật khẩu</label>
                    <input type="password" id="signup-password" placeholder="Ít nhất 6 ký tự" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="signup-confirm">Xác nhận mật khẩu</label>
                    <input type="password" id="signup-confirm" placeholder="Nhập lại mật khẩu" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-signup">
                    Tạo tài khoản
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">hoặc</div>

            <!-- Google Sign-in -->
            <button class="btn btn-google" id="btn-google" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Đăng nhập với Google
            </button>

            <p style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
                Đồ án Lab 2 - Tư Duy Tính Toán &bull; HCMUS
            </p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
