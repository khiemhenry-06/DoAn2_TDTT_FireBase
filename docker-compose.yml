
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: visionai-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount file key vào container để backend có thể kết nối Firebase
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visionai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
